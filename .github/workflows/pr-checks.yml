name: PR checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    name: Node tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # A test file that never exits must not hold its shard for the 6 h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        if: matrix.shard == 1
        run: npm run check

      - name: Run tests
        env:
          L2NODE_TEST_TIMEOUT_MS: 180000
        run: npm test -- --keep-going --shard=${{ matrix.shard }}/4
