name: Windows backup lock proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-proof:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: node launcher/test/windows-backup-lock-proof.cjs
