[Database]
path = tmp/nodel2.sqlite
checkpointIntervalMs = 5000
checkpointMinWalBytes = 4194304
; PASSIVE keeps checkpoint I/O off gameplay writes but cannot reset a WAL under
; continuous writers. The population service requests a short TRUNCATE only
; while no real or connecting player is present and the DB queue is idle.
checkpointResetWalBytes = 268435456
checkpointResetGrowthBytes = 67108864
checkpointResetIntervalMs = 5000
checkpointResetCooldownMs = 60000
checkpointResetRetryMs = 5000
checkpointResetBusyTimeoutMs = 50

