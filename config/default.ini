[Database]
path = tmp/nodel2.sqlite
checkpointIntervalMs = 5000
checkpointMinWalBytes = 4194304
; PASSIVE keeps checkpoint I/O off gameplay writes but cannot reset a WAL under
; continuous writers. The population service requests a short TRUNCATE after a
; passive checkpoint, only while no real or connecting player is present and the
; DB queue is idle.
checkpointResetWalBytes = 268435456
checkpointResetGrowthBytes = 67108864
checkpointResetCooldownMs = 60000
checkpointResetRetryMs = 5000
checkpointResetBusyTimeoutMs = 50

[AuthServer]
hostname = 0.0.0.0
port = 2106
protocol = 0xc621
blowfishKey = _;5.]94-31==-%xT!^[$
autoCreate = true

[GameServer]
hostname = 0.0.0.0
; Optional IPv4 sent to clients after login. Leave commented to preserve the
; legacy automatic address detection (local/LAN behavior).
; advertisedHostname = 100.92.15.42
port = 7777
id = 1
maxOnline = 1000
pvp = false
; Shared personal warehouse slots per player account (1..1000). Bots keep their own warehouses.
playerWarehouseSlots = 300

[General]
protocol = 656
maxLevel = 78
progressionPreset = x1
expRate = 1.0
adenaRate = 1.0
dropChanceRate = 1.0
; Characters with karma and at least 5 PKs: chance (C4 KarmaRateDrop) that a death drops items.
pkDeathDropChance = 0.7
showMonsterLevel = true
; Beginner shots in the village bounty quests: strict, grant (legacy characters), always.
newbieRewardPolicy = strict

[Enchant]
weaponChance = 68
armorChance = 52
accessoryChance = 54
blessedWeaponChance = 68
blessedArmorChance = 52
blessedAccessoryChance = 54
crystalWeaponChance = 68
crystalArmorChance = 52
crystalAccessoryChance = 54
maxWeapon = 0
maxArmor = 0
maxAccessory = 0
safeMax = 3
safeMaxFull = 4

[OpenRouter]
enabled = false
apiKey =
apiUrl = https://openrouter.ai/api/v1/chat/completions
model = openai/gpt-5.6-luna
partyRouterModel = openai/gpt-5.6-luna
; Leave empty for models that do not accept temperature.
