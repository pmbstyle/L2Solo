[Langfuse]
enabled = false
envFile =
baseUrl = http://localhost:3000
capturePayloads = true
debug = false

[BotPopulation]
; Master switch for optional developer logs, counters, timings and IPC.
developerDiagnostics=false
; Diagnostics: one heap snapshot of the cold worker per server boot as its heap nears its cap,
; into tmp/heap/ (~1 GB file; the worker stalls while it is written). Restart to apply.
coldWorkerHeapSnapshot = false
; The decision trace: what every bot decided and why (situations raised, decisions taken, deaths with the
; killer, worker restarts, survived failures), into logs/decision-trace.jsonl through the history worker, kept 48 h.
; Off for players; switch it on in config/local.ini to look at a server (scripts/trace.js reads it).
decisionTrace = false
enabled = true
; Personal errors and learning from own actions. false = unbiased estimates,
; no new learning points; public board evidence still affects decisions. Restart to apply.
knowledgeErrorsEnabled = true
; Autonomous PvP escalation and revenge, hot and cold. Range 0..1; restart to apply.
; 0 = no initiation (self-defense remains), 0.5 = current balance, 1 = maximum aggression.
; At 1, eligible nonzero escalation chances reach 100%; zero chances and combat guards remain.
; This is an aggression level, not the probability of attacking every encountered bot.
; Higher values also tolerate worse odds and delay retreat; lower values favor escape.
pvpAggression = 0.5
ambientScenesEnabled = true
ambientSceneCooldownMs = 180000
ambientPairCooldownMs = 90000
ambientSceneTtlMs = 8000
backgroundResolverEnabled = true
backgroundPartyEnabled = true
; Free compatible bots can assemble a native raid party, then choose a suitable live boss.
; Restart to apply. Keep at least this fraction of each ten-level boss band alive.
opportunisticRaidsEnabled = true
opportunisticRaidAliveFraction = 0.5
opportunisticRaidIntervalMs = 900000
opportunisticRaidMemberCooldownMs = 1800000
opportunisticRaidMaxParties = 2
; Admission forecast: maximum fight duration and matching soulshot reserve multiplier.
opportunisticRaidMaxFightSeconds = 720
opportunisticRaidShotReserve = 1.3
opportunisticRaidExpeditionMs = 2700000
phasePolicyEnabled = true
backgroundGovernorEnabled = true
backgroundJobTickMs = 250
backgroundGovernorWindowMs = 1000
backgroundGovernorIdleBudgetMs = 250
backgroundGovernorPlayerBudgetMs = 80
backgroundGovernorIdleDbQueueMax = 8
backgroundGovernorPlayerDbQueueMax = 8
backgroundGovernorLagAbortMs = 120
maxPlayingPopulation = 1700
starterBotsPerRace = 30
; New bots' starting classes by weight (C4 starting classes; the professions then split evenly).
; The default: ~75 % damage dealers, ~7 % healers, ~6 % buffers, ~12 % dwarves. A wave of
; 5 x starterBotsPerRace bots splits across the starter regions by their classes' weights.
; Existing bots keep their class.
classMix = humanFighter:18,humanMystic:4,elfFighter:16,elfMystic:6,darkFighter:17,darkMystic:6,orcFighter:16,orcMystic:5,dwarf:12
generatedColdBatchSize = 50
generatedColdSeedDelayMs = 45000
partyHistoryRetentionMs = 86400000
partyHistoryCleanupBatchSize = 1000
; A bot becomes a live body within this distance of a player: the client view (6000) plus one
; 10 s activation scan at run speed. Bodies cool 1400 further out (cooldownRadius 9000).
activationRadius = 7600
maxActivationsPerScan = 6
activationFloorDirectZ = 1200
activationFloorGeoChecksPerScan = 24
activationFloorCacheMs = 30000
activationFloorCacheLimit = 2048
devLogPlayerChat = true

