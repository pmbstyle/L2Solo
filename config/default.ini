strategicManagementEnabled = true
strategyMinHoldMs = 1800000
strategyStallMs = 21600000
strategyRetryMs = 300000
llmTitleManagementEnabled = false
goalReviewMs = 300000
equipmentReviewMs = 900000
equipmentPartyStallMs = 900000
equipmentHardStallMs = 21600000
equipmentMaxExpectedKills = 1500
resolveIntervalMs = 60000
resolveBatchSize = 16
resolveBudgetMs = 80
actionPlayerBudgetMs = 20
founderResolveBudgetMs = 20
founderPlayerBudgetMs = 5
actionBatchSize = 8
actionLeaseMs = 120000
actionRetryMs = 60000

[WorldObserver]
