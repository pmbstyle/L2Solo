[Perf]
; Live recorder for a server that runs for days (src/Perf/LiveRecorder.js, scripts/perf.js).
; Off: nothing runs. On (in config/local.ini): tmp/perf/live/<boot>/ gets a timeline per 30 s,
; a CPU profile per minute of the threads below (kept when a busy run is long), spikes-<day>.jsonl.
; While on, mainElu/workerElu in the BotPopulation line read high (a running CPU profiler inflates
; Node's event-loop utilization: 0.5 real reads 0.8); the busy share in `perf.js timeline` is right.
live = false
dir = tmp/perf/live
; main, and workers by name or file name. V8 samples every ~1 ms (not configurable through Node).
cpuThreads = main,l2node-cold-simulation
cpuChunkSeconds = 60
; A busy run (event-loop turn) this long goes to spikes.jsonl with the code that held it.
longTurnMs = 50
; A chunk whose longest run reaches this is kept as a .cpuprofile (Chrome DevTools); per day the
; keepProfilesPerDay worst of them stay (longest run first), and every captured one.
keepProfileMs = 200
keepProfilesPerDay = 100
; Sampling heap profile (live memory by allocating code) of these threads, written every
; heapEveryMinutes; never reset, so `perf.js heap` diffs the first dump of a boot against the last.
; heapSampleKb: one sample per this many allocated KB (32 cost the worker ~6 %, 128 ~1 %).
heapThreads = main,l2node-cold-simulation,ClanPlanningWorker
heapSampleKb = 128
heapEveryMinutes = 60
; Heap dumps kept per thread: the first (baseline) and the newest.
keepHeapProfiles = 100
keepDays = 14
