[Enchant]

Chances are percentages for attempts outside the safe enchant range.

weaponChance = 68 — Normal weapon-scroll success chance.
armorChance = 52 — Normal armor-scroll success chance for armor.
accessoryChance = 54 — Normal armor-scroll success chance for jewelry.
blessedWeaponChance = 68 — Blessed weapon-scroll success chance.
blessedArmorChance = 52 — Blessed armor-scroll success chance for armor.
blessedAccessoryChance = 54 — Blessed armor-scroll success chance for jewelry.
crystalWeaponChance = 68 — Crystal weapon-scroll success chance.
crystalArmorChance = 52 — Crystal armor-scroll success chance for armor.
crystalAccessoryChance = 54 — Crystal armor-scroll success chance for jewelry.
maxWeapon = 0 — Maximum weapon enchant level. 0 means no configured cap.
maxArmor = 0 — Maximum armor enchant level. 0 means no configured cap.
maxAccessory = 0 — Maximum jewelry enchant level. 0 means no configured cap.
safeMax = 3 — Guaranteed success up to and including +3.
safeMaxFull = 4 — Guaranteed success for one-piece full-body armor up to and including +4. 
